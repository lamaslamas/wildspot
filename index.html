<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f0" />
    <meta name="description" content="WildSpot: i posti migliori per fotografare animali selvatici intorno a te. The best wildlife photo spots near you." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>WildSpot</title>
  </head>
  <body>
    <!-- Presentazione: occupa quasi tutto il primo schermo, lasciando
         intravedere in basso l'inizio della mappa per invitare a scorrere -->
    <header class="hero" id="top">
      <div class="hero-top">
        <img class="hero-logo" src="/logo.svg" alt="WildSpot" width="165" height="50" />
        <div class="lingua-hero" data-selettore-lingua></div>
      </div>

      <div class="hero-testo">
        <h1 class="hero-titolo">
          <span data-i18n="hero.titolo"></span><span class="evidenza" data-i18n="hero.titoloEvidenza"></span>
        </h1>
        <p class="hero-sottotitolo" data-i18n="hero.sottotitolo"></p>

        <ul class="hero-punti">
          <li>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" /><circle cx="12" cy="10" r="2.5" /></svg>
            <span data-i18n="hero.puntoAvvistamenti"></span>
          </li>
          <li>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
            <span><span data-i18n="hero.puntoLuce"></span> <em class="tag" data-i18n="hero.inArrivo"></em></span>
          </li>
          <li>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z" /></svg>
            <span><span data-i18n="hero.puntoMeteo"></span> <em class="tag" data-i18n="hero.inArrivo"></em></span>
          </li>
          <li>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6zM6 3v18M10 8h5M10 12h5" /></svg>
            <span><span data-i18n="hero.puntoDiario"></span> <em class="tag" data-i18n="hero.inArrivo"></em></span>
          </li>
        </ul>

        <!-- La freccia che rimbalza invita anche a scorrere: niente indicatore separato -->
        <a class="btn btn-primario hero-cta" href="#app">
          <span data-i18n="hero.apriMappa"></span>
          <svg class="freccia" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </a>
      </div>
    </header>

    <!-- Applicazione: alta esattamente uno schermo -->
    <section class="app" id="app">
      <div class="topbar">
        <a class="topbar-logo" href="#top" data-i18n-aria="aria.tornaSu">
          <img src="/logo-simbolo.svg" alt="" width="34" height="32" />
        </a>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <button id="settings" class="icon-btn" type="button" data-i18n-aria="aria.impostazioni">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
          </svg>
        </button>
        <button id="info" class="icon-btn" type="button" data-i18n-aria="aria.info">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M12 11v6M12 7v.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <div class="map-wrap">
        <div id="map" data-i18n-aria="aria.mappa"></div>
        <!-- Pulsante flottante sopra la mappa, in basso a destra -->
        <button id="locate" class="locate" type="button" data-i18n-aria="aria.posizione">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="currentColor" />
            <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="currentColor" stroke-width="2" />
          </svg>
        </button>
      </div>

      <!-- Comandi in basso, raggiungibili con il pollice -->
      <nav class="controls" data-i18n-aria="aria.comandi">
        <div class="radius" role="radiogroup" data-i18n-aria="aria.raggio">
          <!-- I pulsanti del raggio vengono generati da src/radius.js -->
        </div>
        <button id="open-filters" class="filters-btn" type="button">
          <span data-i18n="filtri"></span> <span id="filters-badge" class="badge" hidden></span>
        </button>
      </nav>
    </section>

    <!-- Pannello a scomparsa dal basso: usato per filtri, schede e informazioni -->
    <section id="sheet" class="sheet" aria-hidden="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title" class="sheet-title"></h2>
        <button id="sheet-close" class="icon-btn" type="button" data-i18n-aria="aria.chiudi">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
